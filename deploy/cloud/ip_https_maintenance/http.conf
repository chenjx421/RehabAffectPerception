server {
    listen 80 default_server;
    server_name YOUR_SERVER_IP;
    access_log off;
    root /var/www/rehab-ip-acme;

    location ~ "^/\.well-known/acme-challenge/[A-Za-z0-9_-]+$" {
        limit_except GET HEAD { deny all; }
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
