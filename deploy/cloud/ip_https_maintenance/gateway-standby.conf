# Standby only: never included by the maintenance nginx.conf.
upstream rehab_invitation_gateway {
    server 127.0.0.1:8796;
    keepalive 16;
}

server {
    listen 443 ssl default_server;
    server_name YOUR_SERVER_IP;
    access_log off;
    ssl_certificate /etc/letsencrypt-rehab-ip/production/live/YOUR_SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rehab-ip/production/live/YOUR_SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IPMaintenanceTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 16m;
    client_body_timeout 360s;
    send_timeout 360s;

    location / {
        proxy_pass http://rehab_invitation_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host YOUR_SERVER_IP;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_connect_timeout 5s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }
}
