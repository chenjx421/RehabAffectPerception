server {
    listen 443 ssl default_server;
    server_name YOUR_SERVER_IP;
    access_log off;
    ssl_certificate /etc/letsencrypt-rehab-ip/production/live/YOUR_SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-rehab-ip/production/live/YOUR_SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:IPMaintenanceTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    root /var/www/rehab-ip-maintenance;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Retry-After "300" always;

    error_page 503 /__maintenance.html;
    location = / {
        limit_except GET HEAD { deny all; }
        return 503;
    }
    location = /__maintenance.html {
        internal;
        alias /var/www/rehab-ip-maintenance/index.html;
    }
    location / { return 404; }
}
